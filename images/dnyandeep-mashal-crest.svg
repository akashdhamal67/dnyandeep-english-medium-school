<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none" class="dnyandeep-mashal-crest" role="img" aria-label="Dnyandeep Mashal Emblem">
  <defs>
    <!-- Radial & Linear Gradients for Institutional Warmth -->
    <linearGradient id="shieldBg" x1="100" y1="10" x2="100" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#143823"/>
      <stop offset="100%" stop-color="#0c2416"/>
    </linearGradient>
    
    <linearGradient id="goldGradient" x1="40" y1="20" x2="160" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E5C778"/>
      <stop offset="45%" stop-color="#C29B38"/>
      <stop offset="100%" stop-color="#8F6E1C"/>
    </linearGradient>

    <linearGradient id="flameInner" x1="100" y1="120" x2="100" y2="35" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D49B24"/>
      <stop offset="50%" stop-color="#F3CA68"/>
      <stop offset="100%" stop-color="#FFF8E7"/>
    </linearGradient>

    <linearGradient id="flameOuter" x1="100" y1="125" x2="100" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B87314"/>
      <stop offset="40%" stop-color="#DE9D2B"/>
      <stop offset="85%" stop-color="#F5D77F"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- External Classical Shield Outline (Doon / Oxford inspired institutional shield) -->
  <path d="M100 12 C148 12 185 18 185 18 C185 85 180 156 100 228 C20 156 15 85 15 18 C15 18 52 12 100 12 Z" 
        fill="url(#shieldBg)" stroke="url(#goldGradient)" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Inner Inset Shield Rim -->
  <path d="M100 20 C143 20 176 25 176 25 C176 86 171 150 100 217 C29 150 24 86 24 25 C24 25 57 20 100 20 Z" 
        fill="none" stroke="url(#goldGradient)" stroke-width="1.2" opacity="0.65" stroke-dasharray="4 2"/>

  <!-- Star of Wisdom / Guiding North Star at top -->
  <path d="M100 26 L102.5 32 L108 33 L103.5 36.5 L105 42 L100 38.5 L95 42 L96.5 36.5 L92 33 L97.5 32 Z" 
        fill="url(#goldGradient)" opacity="0.9"/>

  <!-- 1. The Sacred Flame (Agni / Knowledge Torch Flame) -->
  <!-- Outer Flame Swirls -->
  <path d="M100 32 C106 48 126 62 126 82 C126 102 112 116 100 122 C88 116 74 102 74 82 C74 62 94 48 100 32 Z" 
        fill="url(#flameOuter)" filter="url(#subtleGlow)"/>

  <!-- Dynamic Traditional Flame Tongue Sculpting -->
  <path d="M100 40 C103 52 118 64 118 80 C118 96 108 108 100 114 C92 108 82 96 82 80 C82 65 96 52 100 40 Z" 
        fill="url(#flameInner)"/>

  <!-- Inner Pure Core Light -->
  <path d="M100 56 C102 65 110 75 110 86 C110 97 104 104 100 108 C96 104 90 97 90 86 C90 75 98 65 100 56 Z" 
        fill="#FFFFFF" opacity="0.9"/>

  <!-- Left Accent Tongue -->
  <path d="M84 78 C80 68 85 58 88 54 C87 62 90 68 95 72 C91 75 86 76 84 78 Z" 
        fill="url(#goldGradient)" opacity="0.8"/>

  <!-- Right Accent Tongue -->
  <path d="M116 78 C120 68 115 58 112 54 C113 62 110 68 105 72 C109 75 114 76 116 78 Z" 
        fill="url(#goldGradient)" opacity="0.8"/>

  <!-- 2. The Traditional Brass / Metal Mashal Bowl (Katora) with Indian Motifs -->
  <!-- Bowl Rim -->
  <path d="M68 118 C68 115 132 115 132 118 L128 127 C128 127 100 131 72 127 Z" 
        fill="url(#goldGradient)" stroke="#4A360D" stroke-width="0.8"/>

  <!-- Fluted Floral Bowl Body -->
  <path d="M72 127 C75 142 85 152 100 154 C115 152 125 142 128 127 Z" 
        fill="url(#goldGradient)"/>
  
  <!-- Bowl Inlay Carvings -->
  <path d="M82 128 C85 140 92 147 100 148 C108 147 115 140 118 128" 
        fill="none" stroke="#143823" stroke-width="1.2" opacity="0.6"/>
  <circle cx="100" cy="138" r="2.5" fill="#143823" opacity="0.8"/>
  <circle cx="91" cy="135" r="1.8" fill="#143823" opacity="0.7"/>
  <circle cx="109" cy="135" r="1.8" fill="#143823" opacity="0.7"/>

  <!-- 3. Torch Stem & Baluster (Traditional Pillar Carving) -->
  <path d="M94 154 L106 154 L104 172 L96 172 Z" fill="url(#goldGradient)"/>
  <!-- Middle Ornamental Ring -->
  <rect x="91" y="161" width="18" height="3" rx="1" fill="#E5C778" stroke="#8F6E1C" stroke-width="0.5"/>
  <path d="M96 172 L104 172 L102 188 L98 188 Z" fill="url(#goldGradient)"/>
  <!-- Lower Finial -->
  <circle cx="100" cy="191" r="3.5" fill="url(#goldGradient)"/>

  <!-- 4. Classical Open Book of Learning (Vidya / Gyan) at the Base of the Torch -->
  <g id="openBook" transform="translate(100, 196) scale(0.9) translate(-100, -196)">
    <!-- Left Page -->
    <path d="M100 188 C85 184 66 186 52 192 L52 208 C66 202 85 200 100 204 Z" 
          fill="#FAF8F5" stroke="url(#goldGradient)" stroke-width="1.2"/>
    <!-- Left Page Ruling Lines -->
    <line x1="60" y1="193" x2="94" y2="190" stroke="#C29B38" stroke-width="0.8" opacity="0.7"/>
    <line x1="60" y1="197" x2="94" y2="194" stroke="#C29B38" stroke-width="0.8" opacity="0.7"/>
    <line x1="60" y1="201" x2="94" y2="198" stroke="#C29B38" stroke-width="0.8" opacity="0.7"/>

    <!-- Right Page -->
    <path d="M100 188 C115 184 134 186 148 192 L148 208 C134 202 115 200 100 204 Z" 
          fill="#FAF8F5" stroke="url(#goldGradient)" stroke-width="1.2"/>
    <!-- Right Page Ruling Lines -->
    <line x1="106" y1="190" x2="140" y2="193" stroke="#C29B38" stroke-width="0.8" opacity="0.7"/>
    <line x1="106" y1="194" x2="140" y2="197" stroke="#C29B38" stroke-width="0.8" opacity="0.7"/>
    <line x1="106" y1="198" x2="140" y2="201" stroke="#C29B38" stroke-width="0.8" opacity="0.7"/>

    <!-- Book Spine -->
    <path d="M100 188 L100 205" stroke="url(#goldGradient)" stroke-width="2"/>
  </g>

  <!-- 5. Laurel Wreath / Olive Branches of Honour -->
  <g stroke="url(#goldGradient)" fill="none" stroke-width="1" opacity="0.85">
    <!-- Left Foliage Branch -->
    <path d="M42 165 C38 135 44 95 62 70"/>
    <path d="M42 155 C46 150 49 146 51 144" fill="url(#goldGradient)"/>
    <path d="M39 138 C44 134 48 131 51 129" fill="url(#goldGradient)"/>
    <path d="M41 120 C46 116 51 113 54 112" fill="url(#goldGradient)"/>
    <path d="M46 102 C52 99 57 98 60 97" fill="url(#goldGradient)"/>
    <path d="M54 85 C60 83 65 82 68 82" fill="url(#goldGradient)"/>

    <!-- Right Foliage Branch -->
    <path d="M158 165 C162 135 156 95 138 70"/>
    <path d="M158 155 C154 150 151 146 149 144" fill="url(#goldGradient)"/>
    <path d="M161 138 C156 134 152 131 149 129" fill="url(#goldGradient)"/>
    <path d="M159 120 C154 116 149 113 146 112" fill="url(#goldGradient)"/>
    <path d="M154 102 C148 99 143 98 140 97" fill="url(#goldGradient)"/>
    <path d="M146 85 C140 83 135 82 132 82" fill="url(#goldGradient)"/>
  </g>

  <!-- 6. Bottom Ribbon Banner with "ESTD 1944" -->
  <g id="ribbonBanner" transform="translate(0, 5)">
    <!-- Ribbon Shadow/Underlay -->
    <path d="M48 214 L36 222 L48 226 L48 214 Z" fill="#4A360D"/>
    <path d="M152 214 L164 222 L152 226 L152 214 Z" fill="#4A360D"/>

    <!-- Main Ribbon Scroll -->
    <path d="M44 213 C72 208 128 208 156 213 L152 227 C126 222 74 222 48 227 Z" 
          fill="url(#goldGradient)" stroke="#8F6E1C" stroke-width="0.8"/>

    <!-- Ribbon Text -->
    <text x="100" y="222" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="700" 
          letter-spacing="0.16em" fill="#143823" text-anchor="middle">
      ESTD 1944
    </text>
  </g>
</svg>

